services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: gateway
    container_name: gateway
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: gateway
      SERVICE_TAGS: dev
    working_dir: /var/www
    volumes:
      - ./gateway:/var/www
      - ./gateway/docker-compose/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - alegra-network
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
      - ./gateway/docker-compose/mysql/initdb.d:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - alegra-network

  webserver:
    image: nginx:alpine
    container_name: nginx-webserver
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./gateway:/var/www
      - ./gateway/docker-compose/nginx:/etc/nginx/conf.d/
    networks:
      - alegra-network
    depends_on:
      - gateway

  warehouse:
    build:
      context: ./warehouse
      dockerfile: Dockerfile
    image: warehouse
    container_name: warehouse
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: warehouse
      SERVICE_TAGS: dev
    working_dir: /var/www
    volumes:
      - ./warehouse:/var/www
      - ./warehouse/docker-compose/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - ./warehouse/var/log/supervisor:/var/log/supervisor
    networks:
      - alegra-network
    depends_on:
      - db

  warehouseWebserver:
    image: nginx:alpine
    container_name: warehouse-webserver
    restart: unless-stopped
    volumes:
      - ./warehouse:/var/www
      - ./warehouse/docker-compose/nginx:/etc/nginx/conf.d/
    networks:
      - alegra-network
    depends_on:
      - warehouse

  kitchen:
    build:
      context: ./kitchen
      dockerfile: Dockerfile
    image: kitchen
    container_name: kitchen
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: kitchen
      SERVICE_TAGS: dev
    working_dir: /var/www
    volumes:
      - ./kitchen:/var/www
      - ./kitchen/docker-compose/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - alegra-network
    depends_on:
      - db

  kitchenWebserver:
    image: nginx:alpine
    container_name: kitchen-webserver
    restart: unless-stopped
    volumes:
      - ./kitchen:/var/www
      - ./kitchen/docker-compose/nginx:/etc/nginx/conf.d/
    networks:
      - alegra-network

networks:
  alegra-network:
    driver: bridge

volumes:
  dbdata:
    driver: local